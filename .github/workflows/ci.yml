name: Reconverse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      LCI_ATTR_BACKEND: ofi
      FI_PROVIDER: tcp
    name: Build and Test

    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libfabric-bin libfabric-dev openmpi-bin openmpi-common openmpi-doc libopenmpi-dev

      - name: Verify Installation
        run: |
          cmake --version
          ninja --version
          mpicc --version
          mpirun --version
          fi_info --version

      - name: With the LCI communication backend
        shell: bash
        run: |
            cmake \
                -Bbuild \
                -GNinja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DRECONVERSE_AUTOFETCH_LCI2=ON \
                -DRECONVERSE_TEST_LAUNCHER="mpirun;--oversubscribe" \
                -DLCT_PMI_BACKEND_ENABLE_MPI=ON \
                -DCMK_TASKQUEUE=ON \
                .
            cmake --build build --target all
            ctest --test-dir build --extra-verbose --timeout 60

      - name: With the LCW communication backend
        shell: bash
        run: |
            cmake \
                -Bbuild \
                -GNinja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DRECONVERSE_AUTOFETCH_LCW=ON \
                -DRECONVERSE_TEST_LAUNCHER="mpirun;--oversubscribe" \
                -DCMK_TASKQUEUE=ON \
                .
            cmake --build build --target all
            ctest --test-dir build --extra-verbose --timeout 60

  c-header-compat:
    runs-on: ubuntu-latest
    name: converse.h is valid C

    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang

      # converse.h is included from C translation units, not just C++ ones
      # (Charm++ and user programs both do this), so it has to parse under a
      # C compiler. Its unconditional <stdatomic.h> puts the floor at C11.
      # This is a parse check only: it needs no build of reconverse itself,
      # so it stays cheap and runs even when the full build is broken.
      - name: Include converse.h from a C translation unit
        shell: bash
        run: |
          printf '#include "converse.h"\nint main(void) { return 0; }\n' > c_include_check.c
          status=0
          for cc in gcc clang; do
            for std in c11 gnu11 c17 gnu17; do
              echo "== $cc -std=$std =="
              "$cc" -std="$std" -fsyntax-only -Iinclude c_include_check.c || status=1
            done
          done
          exit $status
